# version: "3.9"
services:
  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/Django-projects-2
    ports:
      - "8001:8000"
    depends_on:
      - db
  db:
    image: postgres:13
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      POSTGRES_USER: postgres         
      POSTGRES_PASSWORD: postgres 
      POSTGRES_DB: dbDjango
    ports:
      - "5433:5432"                  
volumes:
  postgres_data: