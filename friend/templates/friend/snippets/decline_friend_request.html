<script type="text/javascript">
	
	function declineFriendRequest(friend_request_id, uiUpdateFunction){
		// Crea la URL para rechazar la solicitud de amistad, reemplazando el ID de la solicitud en la plantilla de URL.
		var url = "{% url 'friend:friend-request-decline' friend_request_id=53252623623632623 %}".replace("53252623623632623", friend_request_id)
		
		// Inicia la solicitud AJAX para rechazar la solicitud de amistad.
		$.ajax({
			type: 'GET',  // Método de la solicitud.
			dataType: "json",  // Tipo de datos que se espera de la respuesta.
			url: url,  // URL para rechazar la solicitud de amistad.
			timeout: 5000,  // Tiempo de espera para la solicitud en milisegundos.
			
			// Función que se ejecuta si la solicitud es exitosa.
			success: function(data) {
				console.log("SUCCESS", data)  // Muestra el resultado en la consola.
				
				// Verifica si la respuesta indica que la solicitud de amistad fue rechazada.
				if(data['response'] == "Solicitud de amistad rechazada."){
					// Aquí se actualiza la interfaz de usuario.
				}
				else if(data['response'] != null){
					// Muestra un mensaje de alerta con la respuesta del servidor.
					alert(data['response'])
				}
			},
			
			// Función que se ejecuta si ocurre un error en la solicitud.
			error: function(data) {
				console.error("ERROR...", data)  // Muestra el error en la consola.
				alert("Algo salió mal.")  // Informa al usuario que hubo un error.
			},
			
			// Función que se ejecuta al finalizar la solicitud, sin importar si fue exitosa o fallida.
			complete: function(data){
				uiUpdateFunction()  // Llama a la función para actualizar la interfaz de usuario.
			}
		});
	}
</script>
