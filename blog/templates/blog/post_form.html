{% extends "blog/base.html" %}
{% load crispy_forms_tags %} <!-- Carga las etiquetas de Crispy Forms para facilitar el renderizado de formularios en Django -->

{% block title %}Post{% endblock %}

{% block content %}
<div class="m-auto w-100 container">
    <div class="content-section">
        <!-- Formulario para nueva publicación -->
        <form action="" method="POST">
            {% csrf_token %}
            <!-- Sección del formulario -->
            <fieldset class="form-group">
                <legend class="border-bottom mb-4">Nueva publicación</legend>
                {{ form.media }} <!-- Carga los archivos de medios del formulario -->
                {{ form|crispy }} <!-- Renderiza el formulario usando Crispy Forms -->
            </fieldset>
            <!-- Botones de acción para enviar o cancelar -->
            <div class="form-group">
                <button class="btn btn-info" type="submit">Publicar</button>
                <a class="btn btn-danger" href="{% url 'blog-home' %}">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
