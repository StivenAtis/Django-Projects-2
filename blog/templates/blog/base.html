{% load static %}

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css"
      integrity="sha384-TX8t27EcRE3e/ihU7zmQxVncDAy5uIKz4rEkgIXeMed4M0jlfIDPvg6uqKI2xXr2"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.1/css/all.min.css"
      integrity="sha512-+4zCK9k+qNFUR5X+cKL9EIR+ZOhtIloNl9GIKS57V1MyNsYpYcUrUeQc9vNfzsWfV28IaLL3i96P9sdNyeRssA=="
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/cropper/4.1.0/cropper.css"
      integrity="sha512-iAcZ4OrGhQ7KDqtM+LMc+iuv63aJ9O7hPyWBzCXsrZYuhJ6jhdeh40+hf9o4QmZVu8QrH/cWy/JTmoKNOL4Urw=="
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="{% static 'blog/main.css' %}" />
    <title>Social App | {% block title %}{% endblock %}</title>
  </head>
  <body>
    <header class="site-header">
      <!-- NAVBAR -->
      {% include 'blog/navbar.html' %}
    </header>

    <!-- MAIN SECTION -->
    <!-- Contenedor principal de la página que define la estructura del contenido central -->
    <main role="main" class="container">
      <div class="row">
        <!-- Columna para mostrar mensajes al usuario, centrada horizontalmente y con ancho de 8 columnas en pantallas medianas -->
        <div class="col-md-8 m-auto">
          <!-- Verifica si hay mensajes en la variable 'messages' -->
          {% if messages %}
          <!-- Itera sobre cada mensaje en 'messages' -->
          {% for message in messages %}
          <!-- Div de alerta para cada mensaje, con clases dinámicas basadas en 'tags' del mensaje para estilos (éxito, error, etc.) -->
          <div class="alert {{ message.tags }}">{{message}}</div>
          {% endfor %} {% endif %}
          <!-- Finaliza la verificación de existencia de mensajes -->
        </div>
        {% block content %}{% endblock %}
      </div>
    </main>

    <!-- SCRIPTS -->
    <script
      src="https://code.jquery.com/jquery-3.5.1.min.js"
      integrity="sha256-9/aliU8dGd2tb6OSsuzixeV4y/faTqgFtohetphbbj0="
      crossorigin="anonymous"
    ></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"
      integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/js/bootstrap.min.js"
      integrity="sha384-w1Q4orYjBQndcko6MimVbzY0tgp4pWB4lZ7lr30WKz0vr/aWKhXdBNmNb5D92v7s"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/cropper/4.1.0/cropper.min.js"
      integrity="sha512-E+gDQcIvNXE60SjCS38ysf1mGh4ObBpKcUOp0oEaHQHQAdaN2p7GelOpgEdpTuCLoIJyLkNXiqFZbyD9Ak/Ygw=="
      crossorigin="anonymous"
    ></script>

    <script>
      $(function () {
        /* SCRIPT PARA ABRIR EL MODAL CON LA PREVISUALIZACIÓN */

        // Detecta el cambio en el campo de entrada de archivo con el ID "id_image"
        $("#id_image").change(function () {

          // Verifica que haya un archivo seleccionado en el campo de entrada y que sea el primero en la lista (por si se permite seleccionar varios archivos)
          if (this.files && this.files[0]) {

            // Crea una nueva instancia de FileReader, que permite leer el contenido del archivo de forma asíncrona
            var reader = new FileReader();

            // Define una función de callback que se ejecutará una vez que la lectura del archivo esté completa
            reader.onload = function (e) {

              // Cambia el atributo 'src' de la imagen con ID "image" para mostrar la vista previa del archivo cargado
              $("#image").attr("src", e.target.result);

              // Muestra el modal con ID "modalCrop" (posiblemente para permitir al usuario recortar la imagen antes de guardarla)
              $("#modalCrop").modal("show");
            };

            // Inicia la lectura del archivo como una URL de datos (Data URL) para poder cargarlo en la imagen de vista previa
            reader.readAsDataURL(this.files[0]);
          }
        });

        /* SCRIPTS PARA MANEJAR LA CAJA DE RECORTES */

        // Selecciona el elemento de imagen con ID "image" y lo almacena en la variable $image
        var $image = $("#image");

        // Variables para almacenar datos del cuadro de recorte y del lienzo, preservando las configuraciones del cropper
        var cropBoxData;
        var canvasData;

        // Configuración del modal con ID "modalCrop"
        $("#modalCrop")
          .on("shown.bs.modal", function () {

            // Inicializa el plugin Cropper en la imagen $image cuando el modal se muestra
            $image.cropper({

              // Modo de vista, que define restricciones en la posición y tamaño del recorte
              viewMode: 1,

              // Proporción de aspecto cuadrada para el área de recorte (1:1)
              aspectRatio: 1 / 1,

              // Dimensiones mínimas del cuadro de recorte
              minCropBoxWidth: 200,
              minCropBoxHeight: 200,

              // Función que se ejecuta cuando el cropper está listo
              ready: function () {

                // Restaura los datos del lienzo y del cuadro de recorte si ya existen
                $image.cropper("setCanvasData", canvasData);
                $image.cropper("setCropBoxData", cropBoxData);
              },
            });
          })

          // Configura acciones cuando el modal se oculta
          .on("hidden.bs.modal", function () {

            // Guarda los datos actuales del cuadro de recorte y del lienzo antes de destruir el cropper
            cropBoxData = $image.cropper("getCropBoxData");
            canvasData = $image.cropper("getCanvasData");

            // Destruye la instancia de Cropper en $image para liberar memoria
            $image.cropper("destroy");

            // Recarga la página para restablecer el estado inicial
            location.reload();
          });

        // Botón para hacer zoom en la imagen dentro del cropper
        $(".js-zoom-in").click(function () {
          $image.cropper("zoom", 0.1); // Acerca el recorte en un 10%
        });

        // Botón para hacer zoom en la imagen dentro del cropper
        $(".js-zoom-out").click(function () {
          $image.cropper("zoom", -0.1); // Aleja el recorte en un 10%
        });

        /* SCRIPT PARA RECOGER LOS DATOS Y ENVIARLOS AL SERVIDOR */

        // Botón para enviar los datos de recorte y cargarlos en el servidor
        $(".js-crop-and-upload").click(function () {
          // Obtiene los datos de recorte actuales (coordenadas y dimensiones) de la imagen
          var cropData = $image.cropper("getData");

          // Asigna los valores de las coordenadas y dimensiones en campos ocultos para enviar con el formulario
          $("#id_x").val(cropData["x"]);
          $("#id_y").val(cropData["y"]);
          $("#id_height").val(cropData["height"]);
          $("#id_width").val(cropData["width"]);

          // Envía el formulario con los datos de recorte al servidor
          $("#formUpload").submit();
        });
      });
    </script>

    <script type="text/javascript">
      $(document).ready(function (event) {

        // LIKE POSTS

        // Establece un manejador de eventos para el clic en el elemento con ID "like"
        $(document).on("click", "#like", function (event) {
          // Previene el comportamiento predeterminado del enlace o botón (como una recarga de página)
          event.preventDefault();

          // Obtiene el valor del atributo "value" del elemento que se ha clicado (se espera que sea la clave primaria, `pk`)
          var pk = $(this).attr("value");

          // Realiza una solicitud AJAX para enviar datos al servidor
          $.ajax({
            // Configura el tipo de solicitud HTTP como POST
            type: "POST",

            // URL del endpoint en el servidor para gestionar la acción de "like"
            url: '{% url "post-like" %}',

            // Datos que se envían al servidor, incluye la `pk` y el token CSRF para autenticación
            data: { id: pk, csrfmiddlewaretoken: "{{ csrf_token }}" },

            // Especifica que el tipo de datos esperado en la respuesta es JSON
            dataType: "json",

            // Función que se ejecuta en caso de éxito de la solicitud
            success: function (response) {
              // Actualiza el contenido del elemento con ID "like-section" usando el formulario HTML recibido en la respuesta
              $("#like-section").html(response["form"]);

              // Muestra en consola el nuevo contenido HTML del "like-section" para depuración
              console.log($("#like-section").html(response["form"]));
            },

            // Función que se ejecuta en caso de error en la solicitud
            error: function (rs, e) {
              console.log(rs.responseText);
            },
          });
        });

        // COMMENT LIKE

        // Establece un manejador de eventos para el clic en cualquier elemento con la clase "clike"
        $(document).on("click", ".clike", function (event) {
          // Previene el comportamiento predeterminado del clic, como una recarga de página
          event.preventDefault();

          // Obtiene el valor del atributo "value" del elemento clicado, que corresponde a la clave primaria (`pk`) del comentario
          var pk = $(this).attr("value");

          // Realiza una solicitud AJAX para enviar datos al servidor
          $.ajax({
            // Configura la solicitud como POST
            type: "POST",

            // Especifica la URL del endpoint en el servidor que manejará el "like" del comentario
            url: "{% url 'comment-like' %}",

            // Datos enviados al servidor, incluye el ID del comentario (`id: pk`), el ID del post (`pid`) y el token CSRF
            data: {
              id: pk,
              pid: "{{post.pk}}", // `pid` representa la clave primaria del post en el que se comenta
              csrfmiddlewaretoken: "{{ csrf_token }}", // CSRF token para proteger la solicitud
            },

            // Especifica que la respuesta esperada del servidor es en formato JSON
            dataType: "json",

            // Función de éxito que se ejecuta si la solicitud es procesada exitosamente
            success: function (response) {
              // Actualiza el contenido de la sección de comentarios con la respuesta del servidor
              $(".main-comment-section").html(response["form"]);

              console.log($(".main-comment-section").html(response["form"]));
            },

            // Función de error que se ejecuta si la solicitud falla
            error: function (rs, e) {
              console.log(rs.responseText);
            },
          });
        });

        // SAVE POSTS

        // Establece un manejador de eventos para el clic en el elemento con ID "save"
        $(document).on("click", "#save", function (event) {
          // Previene el comportamiento predeterminado del clic (como recargar la página)
          event.preventDefault();

          // Obtiene el valor del atributo "value" del elemento clicado, que contiene la clave primaria (`pk`) del post
          var pk = $(this).attr("value");

          // Realiza una solicitud AJAX para enviar datos al servidor
          $.ajax({
            // Especifica el tipo de solicitud HTTP como POST
            type: "POST",

            // URL del endpoint en el servidor para gestionar la acción de "guardar" (save)
            url: '{% url "post-save" %}',

            // Datos enviados al servidor: la clave primaria (`id`) del post y el token CSRF
            data: { id: pk, csrfmiddlewaretoken: "{{ csrf_token }}" },

            // Especifica que el tipo de datos de la respuesta esperada es JSON
            dataType: "json",

            // Función de éxito que se ejecuta cuando la solicitud se completa correctamente
            success: function (response) {
              // Actualiza el contenido del elemento con ID "save-section" usando el formulario HTML recibido en la respuesta
              $("#save-section").html(response["form"]);

              console.log($("#save-section").html(response["form"]));
            },

            // Función de error que se ejecuta si ocurre un error en la solicitud
            error: function (rs, e) {
              console.log(rs.responseText);
            },
          });
        });

        // COMMENT FORM

        // Establece un manejador de eventos para el envío del formulario con la clase "comment-form"
        $(document).on("submit", ".comment-form", function (event) {
          // Previene el comportamiento predeterminado del formulario (como recargar la página)
          event.preventDefault();

          // Muestra en consola los datos serializados del formulario para verificar qué datos se enviarán al servidor
          console.log($(this).serialize());

          // Realiza una solicitud AJAX para enviar los datos del formulario al servidor
          $.ajax({
            // Configura el tipo de solicitud HTTP como POST
            type: "POST",

            // Obtiene la URL del endpoint del servidor desde el atributo "action" del formulario actual
            url: $(this).attr("action"),

            // Serializa los datos del formulario para enviarlos en el formato adecuado para el servidor
            data: $(this).serialize(),

            // Especifica que el tipo de datos esperado en la respuesta es JSON
            dataType: "json",

            // Función de éxito que se ejecuta si la solicitud es procesada correctamente
            success: function (response) {
              // Actualiza el contenido de la sección de comentarios con la respuesta del servidor
              $(".main-comment-section").html(response["form"]);

              console.log(response["form"]);

              // Limpia el contenido del área de texto del formulario de comentario después de enviar
              $("textarea").val("");
            },

            // Función de error que se ejecuta si la solicitud falla
            error: function (rs, e) {
              console.log(rs.responseText);
            },
          });
        });

        // REPLY FORM

        // Establece un manejador de eventos para el envío de formularios con la clase "reply-form"
        $(document).on("submit", ".reply-form", function (event) {
          // Previene el comportamiento predeterminado del formulario (como la recarga de página)
          event.preventDefault();

          console.log($(this).serialize());

          // Realiza una solicitud AJAX para enviar los datos del formulario al servidor
          $.ajax({
            // Configura el tipo de solicitud HTTP como POST
            type: "POST",

            // Establece la URL del endpoint del servidor usando el atributo "action" del formulario actual
            url: $(this).attr("action"),

            // Serializa y envía los datos del formulario al servidor en el formato adecuado
            data: $(this).serialize(),

            // Especifica que la respuesta esperada del servidor es en formato JSON
            dataType: "json",

            // Función que se ejecuta si la solicitud es exitosa
            success: function (response) {
              // Actualiza el contenido de la sección principal de comentarios con el formulario recibido en la respuesta
              $(".main-comment-section").html(response["form"]);

              console.log(response["form"]);

              // Limpia el contenido del área de texto del formulario de respuesta después del envío
              $("textarea").val("");
            },

            // Función que se ejecuta si ocurre un error en la solicitud
            error: function (rs, e) {
              console.log(rs.responseText);
            },
          });
        });
      });
    </script>

    {% block script %}{% endblock %}
  </body>
</html>
